services:
  quant-trading:
    build: .
    container_name: quantitative-trading
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 数据/输出/日志持久化到宿主机
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped
    command: ["sh", "/usr/local/bin/docker-entrypoint.sh", "cron"]
